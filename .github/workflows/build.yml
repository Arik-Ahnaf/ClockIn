name: Build distributions

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build
      - run: uv run --no-sync python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ./packaging/windows/build.ps1
      - run: uv run --no-sync python app.py --smoke-test "$env:RUNNER_TEMP/clockin-source.json"
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: ClockIn-windows
          path: |
            dist/ClockIn-*-windows-*.zip
            build/verification/*.json

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install Arch build and desktop dependencies
        run: >-
          pacman -Syu --noconfirm --needed git base-devel python uv
          fontconfig freetype2 libglvnd libx11 libxcb libxext libxrender libxi
          libxkbcommon libxkbcommon-x11 xcb-util-cursor xcb-util-image
          xcb-util-keysyms xcb-util-renderutil xcb-util-wm dbus zlib
      - uses: actions/checkout@v4
      - run: uv sync --locked --group build
      - run: uv run --no-sync python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run --no-sync python build.py
      - run: uv run --no-sync python app.py --smoke-test /tmp/clockin-source.json
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run --no-sync python scripts/verify_distribution.py
      - name: Make pacman package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder dist/arch
          cd dist/arch
          runuser -u builder -- makepkg --force --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ClockIn-arch-x86_64
          path: |
            dist/ClockIn-*-linux-*.tar.gz
            dist/arch/*.pkg.tar.zst
            build/verification/*.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ClockIn-*
          path: artifacts
          merge-multiple: true
      - name: Publish verified Windows and Linux distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.pkg.tar.zst' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -eq 3
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "ClockIn $RELEASE_TAG" --notes-file packaging/release-notes.md
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
